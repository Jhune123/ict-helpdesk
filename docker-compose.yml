services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ict-helpdesk-app
    restart: always
    working_dir: /var/www/html
    volumes:
      - /var/www/ict-helpdesk/public:/var/www/html/public
      - /var/www/ict-helpdesk/storage:/var/www/html/storage
      - /var/www/ict-helpdesk/bootstrap/cache:/var/www/html/bootstrap/cache
      - /var/www/ict-helpdesk/.env:/var/www/html/.env
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ict_helpdesk
      DB_USERNAME: laravel
      DB_PASSWORD: secret
      DB_WAIT_TIMEOUT: 120
    networks:
      - ict-net

  webserver:
    image: nginx:alpine
    container_name: ict-helpdesk-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/www/ict-helpdesk/public:/var/www/html/public:ro
      - /var/www/ict-helpdesk/public/build:/var/www/html/public/build:ro
      - /var/www/ict-helpdesk/nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/ict-helpdesk/certbot/www:/var/www/certbot
    depends_on:
      - app
    networks:
      - ict-net

  db:
    image: mysql:8.0
    container_name: ict-helpdesk-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ict_helpdesk
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - /var/www/ict-helpdesk/mysql_data:/var/lib/mysql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --innodb-strict-mode=0
      - --innodb-file-per-table=1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ict-net

  certbot:
    image: certbot/certbot
    container_name: ict-helpdesk-certbot
    volumes:
      - /var/www/ict-helpdesk/certbot/conf:/etc/letsencrypt
      - /var/www/ict-helpdesk/certbot/www:/var/www/certbot
    networks:
      - ict-net

networks:
  ict-net:
    driver: bridge
